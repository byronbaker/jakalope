# Custom Role-Based Agents: Why "Be a Researcher" Beats "Be Helpful"

*The simplest change you can make to get dramatically better work out of an AI agent — and how those agents start to compose into real teams*

---

I want to share the single most useful thing I've learned about building AI agents this year. It's small. It's almost embarrassingly simple. And it will make your agents better than 90% of what's out there.

Here it is: **stop building one agent that tries to do everything. Build several agents that each play one specific role.**

That's it. That's the post.

Okay, not really. Let's actually talk about *why* this works, because once you see it, you'll never go back. And then let's talk about what happens when you start composing those role-specific agents into something even more powerful — a *team*.

## First, a clarifying frame: agent vs. skill vs. persona

This trips up almost every team I've worked with. Hold these three things distinct in your head and you're already ahead of most of the field.

| Concept | What it is | Decides? |
|---|---|---|
| **Agent** | A goal-directed actor that decides *what to do and in what order* to accomplish a defined intent. | Yes — about sequence, escalation, and when it's done. |
| **Skill** | A discrete capability with a fixed input and a fixed output. Independently testable. | No — never decides when to run. The agent decides. |
| **Persona policy** | A behavioral lens (e.g., Strategist, Researcher, Designer) applied to an agent's reasoning. Adjusts what's prioritized, challenged, and how outputs are framed. | No — operates inside the reasoning policy; cannot override it. |

If you remember nothing else from this post: **agents decide, skills do, persona policies shape.** Most teams I see lump all three into one "AI assistant" prompt and then wonder why the output feels generic. It's because three different jobs are wrestling for the steering wheel.

## Role isn't a costume. It's a mindset.

Think about a great researcher you've worked with. Now think about a great strategist. Now think about a great designer. They're all smart, capable people. But ask them the same question and you'll get three completely different answers — not because they have different skills, but because they have different definitions of what a good answer *looks like.*

A researcher's good answer leaves the contradictions visible. It says "here's what we know, here's what we kind of know, here's what we don't know" — and refuses to pretend otherwise.

A strategist's good answer makes a call. It surfaces the trade-offs, names the second-order consequences, and gives you a recommendation you can actually act on.

A designer's good answer makes a thing. It respects the constraints, compares the options, and ends with something you can hold up and look at.

Same question. Three completely different shapes of answer. None of them wrong.

Here's the thing: **that's exactly how it works for AI agents too.** "Role" doesn't change what the agent *can* do. It changes what the agent *thinks counts as done.* And that single thing — the definition of done — is the most powerful prompt you can give it.

When you tell one agent to be a researcher, a strategist, *and* a designer all at once, what it actually optimizes for is plausible-sounding prose that gestures at all three. That's the mediocre middle the field has been complaining about for two years. Give the same agent one role at a time and watch what happens. The work gets sharper. The opinions get clearer. The output becomes useful instead of "useful."

Sagar Mandal puts it beautifully in [*Why Specialization Beats Generalization*](https://www.sagarmandal.com/2026/03/15/agentic-engineering-part-3-role-based-agent-personas-why-specialization-beats-generalization/): the same model produces dramatically different quality depending on the role it's asked to play. Tell it to be everything, you get mediocre at everything. Give it one frame at a time, you get genuinely good at that thing.

## Three habits that separate great role-agents from costume-party ones

**Give it a real definition of done.** Not "be helpful." Something specific. *"A research synthesis is done when every claim is rated, contradictions are kept visible as findings, and gaps are named with the evidence that would close them."* If your agent can't tell when it's finished, it isn't really playing a role — it's just generating text.

**Tell it when to stop and ask for help.** A great senior person, in any field, knows what they shouldn't decide alone. Your agent should too. Spell out the conditions where it pauses, names what it can't resolve, and hands the work to a human (or to another agent). This is what people mean when they say *bounded autonomy* — the agent does the work, the human keeps the right decisions. Without explicit escalation conditions, "autonomous" just means "wrong, faster."

**Be honest about what it doesn't know.** Give your agent three explicit lists: *what I know deeply, what I know a little, what I do not know.* For the third list, give it the redirect ready: "That's not my area — talk to so-and-so." This single change cuts hallucinated confidence by roughly an order of magnitude. It's the cheapest, highest-impact prompt change you can make.

## The next leap: agents that work as a team

Once you have a few sharp role-agents, something cool happens. They start to compose. The Strategist hands a direction to the Designer. The Designer hands a concept to the Researcher to validate. The Researcher hands a friction report back. The work moves around a *team* of specialized agents the same way it would move around a team of specialized humans.

The trick is the same one that makes a good human team work: **the disagreement is the value.**

If your agents always agree with each other, you've built them wrong. That sentence is worth stopping at. Most teams new to multi-agent design assume convergence is the goal — three agents that produce the same answer must mean the system is working. The opposite is true. A Strategist that reads evidence the same way a Researcher does has lost its lens. A Designer that's calling trade-offs instead of generating possibility has stopped being a Designer.

There's something ancient about this principle. Three lenses on the same evidence is the structure of dialectic — thesis/antithesis/synthesis is the most familiar version, but the older traditions (the rabbinic argument-as-method, the Socratic method, the Madhyamaka tetralemma) all run on the same idea: **useful disagreement is generative.** A team of role-specialized agents is just a way to scale that ancient practice without burning out a real human team.

## A taste

Here's a fragment from a recent role-agent definition. Generic enough to share:

> **Role:** Senior research synthesizer.
> **Definition of done:** Every claim carries a confidence rating (validated / probable / observed / gap). Contradictions between sources are kept visible as findings, not silently resolved. Gaps are stated with the specific evidence that would close them.
> **When I escalate:** I stop and ask a human when (a) any claim that would change a downstream design decision is rated "observed" or below, (b) two sources disagree and neither is more trusted, or (c) the question I was given is outside the materials I was given.
> **What I don't do:** Treat stakeholder framing as if it were behavioral evidence. Default to majority view when minority view has stronger grounding. Give a recommendation when I was asked for an analysis.

Notice what's *not* in there: no friendly tone, no persona color, no "I'm Riley your helpful research buddy." Role-agent design isn't about voice. It's about the reasoning frame, the definition of done, and the conditions under which the agent stops and looks up.

## One last thing: build in the right order

If you're going to start, here's the order that saves the most pain. **Knowledge first. Skills second. Reasoning policies third. Agents last.**

Most teams do this in reverse. They start with a flashy agent demo, then realize the agent has no memory, then bolt on a knowledge base, then realize the reasoning is generic, then try to add discipline as an afterthought. The result is a system that produces plausible outputs and can't defend any of them.

Build the boring layers first. By the time you need agents, you'll know exactly what you want them to do.

## You're not behind. You're early.

If this is new to you, take a breath: the field is also new at this. The next wave of useful agent products won't be one-model assistants tuned with clever prompts. They'll be small teams of role-specialized agents — each with a sharp definition of done, honest knowledge boundaries, and clear escalation conditions — composed into workflows that deliver real work end-to-end. Generalist assistants will keep existing for low-stakes work. But the work that actually replaces a step in someone's job is going to come from agents that know what role they're playing and, just as importantly, what they're not.

Pick one role. Define done. Name the escalation conditions. Be honest about what it doesn't know. Ship it. You're going to be amazed how much better it is than the everything-bagel version. And once you have one, you'll be ready to build the team.

  <script>
    (function () {
      const mdEl = document.getElementById('md-content');
      const bodyEl = document.getElementById('article-body');
      if (!mdEl || !bodyEl || typeof marked === 'undefined') return;
      const raw = mdEl.textContent;
      const lines = raw.split('\n');
      const nonEmpty = lines.filter(l => l.trim().length > 0);
      const indent = nonEmpty.reduce((min, l) => { const m = l.match(/^(\s*)/); return Math.min(min, m ? m[1].length : 0); }, Infinity);
      const dedented = lines.map(l => l.slice(indent === Infinity ? 0 : indent)).join('\n').trim();
      const titleMatch = dedented.match(/^#\s+(.+)$/m);
      const dateMatch  = dedented.match(/^<!--\s*date:\s*(.+?)\s*-->$/m);
      if (titleMatch) { document.getElementById('article-title').textContent = titleMatch[1]; document.title = titleMatch[1] + ' — jakalope.ai'; }
      if (dateMatch)  { document.getElementById('article-date').textContent = dateMatch[1]; }
      let content = dedented;
      if (titleMatch) content = content.replace(/^#[ \t]+.+\n?/m, '');
      if (dateMatch)  content = content.replace(/^<!--\s*date:\s*.+?[ \t]*-->\n?/m, '');
      bodyEl.innerHTML = marked.parse(content.trimStart(), { breaks: false, gfm: true });
    })();
  </script>
  <script>
    (function () {
      var t = document.getElementById('nav-toggle');
      var l = document.getElementById('nav-links');
      if (!t || !l) return;
      t.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = l.classList.toggle('open');
        t.setAttribute('aria-expanded', open ? 'true' : 'false');
        t.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      });
      document.addEventListener('click', function () {
        l.classList.remove('open');
        t.setAttribute('aria-expanded', 'false');
        t.setAttribute('aria-label', 'Open menu');
      });
    })();
  </script>
