  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --rule: rgba(255,255,255,0.1);

    body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%); }
    .page { position: relative; z-index: 1; }

    /* ── Nav ── */

    .nav-brand { display: inline-flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--fg); transition: opacity 0.2s; }
    .nav-brand:hover { opacity: 0.75; }
    .nav-brand svg { flex-shrink: 0; }
    .nav-wordmark { font-family: 'Space Mono', monospace; font-weight: 700; font-size: clamp(0.75rem, 2.5vw, 0.95rem); letter-spacing: 0.14em; text-transform: uppercase; line-height: 1; }
    .nav-links { display: flex; align-items: center; gap: 1.5rem; }
    .nav-link { font-family: 'Space Mono', monospace; font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-dim); text-decoration: none; transition: color 0.2s; }
    .nav-link:hover { color: var(--accent); }
    .nav-link.active { color: var(--fg); }
    .nav-toggle { display: none; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; color: var(--fg-dim); padding: 0.25rem; transition: color 0.2s; flex-shrink: 0; }
    .nav-toggle:hover { color: var(--fg); }
    @media (max-width: 1023px) {
      .nav-toggle { display: flex; }
      .nav-links { display: none; position: absolute; top: 100%; right: 0; min-width: 200px; flex-direction: column; align-items: flex-start; gap: 0; background: var(--bg); border: 1px solid var(--rule); border-top: none; padding: 0.25rem 1.5rem 1rem; z-index: 100; }
      .nav-links.open { display: flex; }
      .nav-link { padding: 0.65rem 0; border-bottom: 1px solid rgba(255,255,255,0.05); width: 100%; }
      .nav-link:last-child { border-bottom: none; }
    }
    .section-tagline { font-family: 'Courier Prime', monospace; font-size: clamp(0.8rem, 2vw, 0.9rem); color: var(--fg-dim); line-height: 1.7; margin-top: 0.5rem; margin-bottom: 1.5rem; max-width: 55ch; }

    /* ── Listing shell ── */
    .listing-wrap { max-width: 900px; margin: 0 auto; padding: clamp(2.5rem, 6vw, 4.5rem) clamp(1rem, 5vw, 2rem) clamp(5rem, 12vw, 9rem); }
    .listing-header { margin-bottom: 3rem; }
    .listing-kicker { display: inline-flex; align-items: center; gap: 0.6rem; font-family: 'Space Mono', monospace; font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--fg-dim); margin-bottom: 1rem; }
    .listing-kicker::before { content: ''; display: block; width: 1.5rem; height: 1px; background: var(--accent); }
    .listing-title { font-family: 'Space Mono', monospace; font-weight: 700; font-size: clamp(1.5rem, 5vw, 2.2rem); line-height: 1.2; letter-spacing: 0.01em; color: var(--fg); }
    .listing-header-rule { margin-top: 2rem; border: none; border-top: 1px solid var(--rule); }

    /* ── Projects grid ── */
    .projects-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(0.75rem, 2vw, 1.2rem); }
    @media (max-width: 719px) { .projects-grid { grid-template-columns: repeat(2, 1fr); } }

    .project-card { border: 1px solid rgba(255,255,255,0.1); padding: 1.2rem; display: flex; flex-direction: column; align-items: center; gap: 0.6rem; cursor: pointer; transition: border-color 0.2s; text-align: center; text-decoration: none; color: var(--fg); }
    .project-card:hover { border-color: var(--accent); }
    .project-card:hover .project-title { color: var(--accent); }
    .project-title { font-family: 'Space Mono', monospace; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.04em; color: var(--fg); transition: color 0.2s; }

    .project-card-empty { border: 1px dashed rgba(255,255,255,0.07); padding: 1.2rem; display: flex; flex-direction: column; align-items: center; gap: 0.6rem; opacity: 0.35; text-align: center; }
    .project-card-empty span { font-family: 'Courier Prime', monospace; font-size: 0.65rem; color: var(--fg-dim); }

    @media (max-width: 479px) {
      .project-card, .project-card-empty { padding: 1rem 0.75rem; }
    }

    /* ── Footer ── */
    .listing-footer { max-width: 900px; margin: 0 auto; padding: 2rem clamp(1rem, 5vw, 2rem) 4rem; border-top: 1px solid var(--rule); display: flex; justify-content: flex-end; }
    .footer-site { font-family: 'Space Mono', monospace; font-size: 0.62rem; letter-spacing: 0.12em; color: var(--fg-faint); text-transform: uppercase; }
