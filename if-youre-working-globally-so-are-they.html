# If You're Working Globally, So Are They

*The lessons from distributed, cross-cultural teams that nobody puts in the handbook*

---

Most of the guidance on global teams focuses on the mechanics: how to run a standup across time zones, how to use async tools effectively, how to structure handoffs so nothing falls through the cracks. That stuff matters. But in my experience, the mechanics aren't what makes or breaks a global team. What makes or breaks it is subtler — and it almost never shows up in the onboarding doc.

I've worked with teams across Japan, India, Belgium, the UK, Costa Rica, and Brazil over the past several years. I've flown to Barcelona and spent three days in the same conference room without seeing the city. I've gotten a personal invitation from a client's VP to visit Japan — not to close a deal, but because he said, *"I want you to come so that you can fully understand not just who you are working with, but the environment we work and live in."* That invitation changed how I think about this work.

The mechanics of global collaboration I picked up fast. The other lessons took longer.

## The story that reframed everything for me

Early in my time working across our global delivery organization, a colleague shared something I've never forgotten. On his very first project working onshore in the US, he walked in overwhelmed — the work was significant, his English wasn't fully confident, and he was terrified of his first meeting. So he hid. Found a dark conference room and hoped nobody would notice he was missing.

Someone went room to room until they found him. And when she did, she didn't make it a thing. She just told him it would be okay — that he should focus on the tech he knew and not worry about the stuff he didn't, like whether he had an opinion on the NFL game that weekend.

That's the whole post, honestly. But let me try to make it more useful than that.

## Three misconceptions worth dismantling

I've organized my thinking on this around three beliefs that seem reasonable and turn out to be wrong — sometimes costly wrong.

---

**Misconception 1: If everyone is speaking the same language, we must have clear communication.**

A meeting where everyone is speaking English doesn't mean everyone understands the same thing. Idioms land differently. Levels of directness differ. Phrasing that reads as aggressive in one register reads as matter-of-fact in another.

I've watched a straightforward status update — "it's not taken up with urgency" — cause visible frustration on the receiving end, when the message was simply "I haven't heard back yet." I've seen messages that read, on the surface, like someone is upset, when the writer was just being efficient in a second language.

The mental habit that fixes this more than any other: **react to intent, not to words.** When a message reads as hostile or accusatory, pause before responding. Ask yourself what a charitable reading of that message would be. Ask a clarifying question rather than addressing the tone. Nine times out of ten, there's no tone — there's just a different style.

This isn't about lowering standards for communication. It's about recognizing that clear communication requires more than a shared vocabulary. It requires shared context, shared cultural assumption, and — most importantly — the grace to assume good faith when the words don't quite land.

---

**Misconception 2: My working style is better than your working style.**

We don't usually say this out loud. But we act on it constantly.

I've noticed it in how I used to react when a decision-making process felt slower than expected, or when an approval required more layers than I thought necessary, or when someone's response to a deadline conveyed a different relationship to urgency than mine. My instinct was to interpret those differences as inefficiencies to be fixed, rather than as a different but coherent way of working.

The 4-way stop is a useful image here. In Portland, four drivers approach an intersection and everyone waits for everyone else to go — including pedestrians on the corner. It's orderly, considerate, and slow. In Bangalore, the same number of vehicles merge through an intersection as a single flowing organism, reading each other's movements in real time. Neither system is wrong. They're both functional responses to different conditions and different collective agreements about how movement should work.

When I encounter a working style that doesn't match mine, the honest first question isn't "how do I fix this?" It's "what is this optimized for, and am I actually understanding it?" Usually, when I get there, what looked like an inefficiency turns out to be a very reasonable adaptation to a different set of constraints.

Some practical things I've started doing: clarify decision ownership explicitly at the start of projects, not when a conflict arises. Use something like a RACI to make visible who approves what, rather than leaving it to assumption. Don't schedule send — it's a small thing, but if a colleague is eight hours ahead and I send a message at the end of my day, I'm starting their morning with my urgency. That's not fair.

---

**Misconception 3: Cultural differences only affect communication.**

This one is the most expensive misconception, because it lets you fix the surface issue — you get clearer about how you write messages, maybe you slow down your idioms — and miss the deeper one.

Cultural context shapes how decisions get made, who is expected to speak in a room, how disagreement is expressed, what "done" means, what risk tolerance looks like, and what it means to give or receive feedback. It shapes who gets heard in a meeting and who goes quiet. It shapes whether a junior team member will push back on a senior one, or whether they'll nod and wait for a private moment.

I've been in meetings where the room agreed on everything out loud and then nothing moved. I've been in meetings where nobody said anything that sounded like disagreement, and then been told afterward that the plan had three serious concerns. Neither room was dishonest. Both rooms were behaving exactly as they were culturally trained to behave. I was the one who didn't know how to read the signal.

The adjustment I've found most useful: **stop designing meetings around the implicit assumption that good ideas rise naturally to the surface.** They don't, and they rise even less naturally across cultural and hierarchical contexts. Build in structure for divergent thinking. Ask for the challenge explicitly — "how could this fail?" gives people permission to voice what they might otherwise hold back. Invite perspectives on comparable situations from somewhere else: *"What's this problem like in your context?"* You get different answers, and the answers are almost always the most useful thing in the room.

## The leadership habit that changed how I show up

There's a moment I return to often. A team I was working with was tense — new faces, no cameras on, people talking over each other. I turned my camera on and said a few words of welcome. Several other cameras came on. The meeting became a meeting.

It sounds small. It is small. But showing your face across distance is not nothing — the human dimension of actually seeing someone's reaction is one of the most underrated tools in global collaboration. Trust moves faster when it has a face attached.

The other leadership shift: I used to treat cross-cultural tension as a communication problem to solve. Now I treat it more often as signal — as a place where the group's diversity is generating something useful, if I create the conditions to hear it. The goal isn't smooth agreement. It's the kind of productive friction that produces better outcomes than any one cultural perspective would have reached alone. That requires a leader who isn't threatened by disagreement, who can hold the direction while inviting the challenge, and who understands that consensus that's been genuinely argued through is worth more than consensus that was performed.

## The line I keep coming back to

Late in a conversation I had about this work, someone offered the simplest version of everything I've said here:

*"If you are working globally with them, then they are working globally with you."*

The burden of adaptation doesn't belong to the person who's newer to the context, or farther from headquarters, or less fluent in the dominant language. It belongs to everyone on the team, equally. When you internalize that — when you stop thinking of "global" as an attribute of your teammates and start thinking of it as an attribute of the work — the whole thing starts to function differently.

You can't find your way back if you were never lost. The moments that have taught me the most about working across difference are the ones where I got something wrong, noticed it, and asked about it. That practice doesn't stop being necessary. It just gets faster.

---

### Want to go deeper?

- [*The Culture Map*](https://erinmeyer.com/book/) — Erin Meyer — the most practically useful book I've read on navigating cultural differences in a business context
- [*Working Across Cultures*](https://hbr.org/topic/subject/cross-cultural-management) — HBR's cross-cultural management collection
- [*The Art of Communicating*](https://www.worldcat.org/title/art-of-communicating/oclc/828590265) — Thich Nhat Hanh — not a business book, but the chapters on listening across difference are the best I've encountered anywhere
- [*Humble Inquiry*](https://www.amazon.com/Humble-Inquiry-Gentle-Instead-Telling/dp/1609949811) — Edgar Schein — on asking rather than telling, and why it matters more in high-stakes, cross-cultural contexts

      if (titleMatch) { document.getElementById('article-title').textContent = titleMatch[1]; document.title = titleMatch[1] + ' — jakalope.ai'; }
      if (dateMatch)  { document.getElementById('article-date').textContent = dateMatch[1]; }
      let content = dedented;
      if (titleMatch) content = content.replace(/^#[ \t]+.+\n?/m, '');
      if (dateMatch)  content = content.replace(/^<!--\s*date:\s*.+?[ \t]*-->\n?/m, '');
      bodyEl.innerHTML = marked.parse(content.trimStart(), { breaks: false, gfm: true });
    })();
  </script>
  <script>
    (function () {
      var t = document.getElementById('nav-toggle');
      var l = document.getElementById('nav-links');
      if (!t || !l) return;
      t.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = l.classList.toggle('open');
        t.setAttribute('aria-expanded', open ? 'true' : 'false');
        t.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      });
      document.addEventListener('click', function () {
        l.classList.remove('open');
        t.setAttribute('aria-expanded', 'false');
        t.setAttribute('aria-label', 'Open menu');
      });
    })();
  </script>
</body>
</html>
