# The Trust Problem in Healthcare UX

*Why health and life sciences is the hardest design domain — and what it takes to get it right*

---

Every design domain has its signature challenge. In fintech, it's confidence — people won't act on a product they don't trust with their money. In enterprise software, it's adoption — the most powerful tool fails if the people who need it find workarounds instead. In consumer apps, it's retention — the first session is cheap; the hundredth is everything.

In health and life sciences, the signature challenge is trust. And it's harder than anywhere else I've worked, because the stakes are different. When someone is trying to understand what their insurance will cover before a procedure, or trying to make sense of a claim they think was processed wrong, or trying to find a specialist who actually accepts new patients and is in-network — they're not browsing. They're often scared, or confused, or already in a difficult moment. The product they're using is one of the primary ways they form their relationship with the entire healthcare system. Get the experience wrong, and the consequences aren't a cancelled subscription. They're a person who doesn't get care they needed, or who goes into a process feeling helpless and comes out feeling deceived.

That's the design brief in this space. Here's what I've learned working inside it.

## The data is sobering

The research on healthcare consumer experience paints a consistent picture. One in three members are less than satisfied with their health insurer's digital experience. That number has been stubbornly resistant to improvement for years, even as insurers have invested heavily in digital. The gap between what members need and what they get isn't a technology gap — it's a design gap. The tools exist. The understanding of what members actually need isn't being translated into the product.

The asymmetry of experience quality is striking. A positive experience — say, good communication during a billing dispute, or a clear and readable explanation of benefits — generates measurably strong downstream behavior: members advocate for the company, seek guidance from them, and add services. A negative experience creates the opposite at roughly three times the magnitude. One confusing claims screen, one login failure at the wrong moment, one form that asks for information the system already has — and the trust that took months to build erodes significantly.

There's a specific place where the trust gap shows up most clearly: costs. The research I've seen consistently points to cost transparency as the highest-value opportunity in health insurance UX. Members want to understand their total out-of-pocket cost before a visit. They want confidence that their claim was processed correctly. They want to know how much they owe and why. These are not exotic requests. They're the same questions that a person naturally has when they receive a bill for something. The fact that answering those questions clearly remains a design challenge in 2025 says something important about how the industry has historically prioritized operational complexity over member experience.

## The trust deficit has a structural cause

There's a finding I keep coming back to, which I think explains a lot about why healthcare UX is hard: patients report connecting with their pharmacists twelve times more often than with their primary care physicians — if they even have a PCP. The pharmacist is trusted. The insurer is not.

This is worth sitting with. The pharmacist has a face, a name, physical proximity, and a history of answering questions without judgment. The health insurer has a portal, a phone tree, and a set of documents that were written by compliance teams and designed by committees. The trust isn't absent in healthcare — it lives in the human moments. What's absent is any strong channel connecting the insurer to those moments.

This is both a diagnosis and an opportunity. The insurers that are getting this right are the ones designing around the moments where members actually need help — not just the moments where insurers need members to complete a transaction. That's a meaningful difference in how you scope a design brief.

## Six principles that change how the work gets done

Working on health insurance UX at a serious level has given me a working set of design principles I now apply broadly. They came from the constraints of this domain, but they travel well.

**Build confidence through clarity.** In healthcare, complexity is often unavoidable — plans are genuinely complicated, benefit structures are genuinely intricate. The design job isn't to hide the complexity; it's to use clear language, progressive disclosure, and well-placed explainers so that complexity is navigable when you need it and invisible when you don't. The worst healthcare UX tries to simplify by omitting. The best simplifies by structuring.

**Optimize for purposeful content.** Every screen in a health insurance app is competing with anxiety. Members arrive with a question, often an urgent one. Promotional content, upsell modules, and engagement nudges that would be acceptable in a consumer app are disruptive here. The research I've seen consistently shows that members want the content that's purposeful for their task, not content that's purposeful for the business. When those two things align — when the member gets what they need and the business outcome follows — you've designed something that works. When they're in tension, always resolve in favor of the member.

**Inform decisions through transparency.** This one is the hardest and the most important. Be honest when an answer isn't available. Don't surface confidence you don't have. Don't design a claims experience that implies certainty about a status that's actually uncertain. Members can handle "we're still processing this" — what destroys trust is "all done" followed by a surprise bill. The research on this is consistent: members don't need perfection. They need honesty about where they are.

**Be brilliant at the basics.** This is the one principle I say most often in rooms of senior people who want to talk about AI and personalization. The majority of member sessions are top-task sessions: check a claim status, find a provider, understand a deductible, pay a bill. If those flows are confusing, slow, or error-prone, no amount of AI-powered personalization fixes the relationship. The exciting work builds on a foundation of basics done well. Build the foundation first.

**Relentlessly prioritize top tasks.** Every member journey has a handful of tasks that matter enormously — tasks that, if completed successfully, drive member confidence and reduce call volume, and that, if done poorly, generate frustration and erode retention. The data to identify those tasks exists in call centers, support tickets, and app analytics. The discipline is to then let that data govern design prioritization, even when stakeholders want features that are more exciting but less needed.

**Support members in moments that matter.** The moments that matter in healthcare aren't always predictable — a new diagnosis, a coverage question before a procedure, a billing dispute after a difficult treatment. What design can do is ensure that the path to help is always visible and fast. Live chat that actually reaches a human. A support flow that doesn't require re-entering information the member just entered. An escalation path from a bot that doesn't feel like a trick. The technology here is straightforward. The commitment to building it, and to measuring whether it's actually working, is where organizations falter.

## The role AI is starting to play

The most significant shift I'm watching in this space is the movement from AI as a cost-reduction tool toward AI as a trust-building tool. The first generation of healthcare AI was primarily about deflection — chatbots that answered simple questions to reduce call volume. That framing is correct as far as it goes, but it misses the larger opportunity.

The larger opportunity is proactive guidance: a system that knows a member's plan well enough to flag when they're about to see an out-of-network provider, or to explain a coverage change before the member discovers it through a denied claim, or to surface a cost-saving option the member didn't know existed. That's not deflection. That's the digital equivalent of the pharmacist relationship — a knowledgeable, accessible presence that helps you navigate a complex system in your interest.

Getting there requires good data architecture, thoughtful personalization design, and an honest conversation about what AI can and can't do reliably in high-stakes health decisions. The members who are best served by AI-assisted guidance aren't the ones who hand decisions over to the AI — they're the ones whose decisions are better informed by it. Designing for that distinction matters.

## Evidence is the foundation

The phrase I've thought about most in this space is one I've come to treat as almost a design philosophy: *evidence is the most powerful design tool.*

In healthcare UX, the temptation is to design around institutional assumptions — what the compliance team needs, what the product roadmap says, what leadership believes members want. Those inputs have their place. But the members using the product every day have better information than any of those sources, and it lives in their behavior, their support calls, their task completion rates, and their direct testimony when you put a prototype in front of them and watch them work.

The organizations that are making real progress in healthcare experience design are the ones that have made evidence — real behavioral evidence, rigorously gathered — the primary input to every significant design decision. Not the only input. The primary one. That shift in how decisions get made is harder than any of the design work that follows from it. But it's where the trust problem starts to get solved.

      const indent = nonEmpty.reduce((min, l) => { const m = l.match(/^(\s*)/); return Math.min(min, m ? m[1].length : 0); }, Infinity);
      const dedented = lines.map(l => l.slice(indent === Infinity ? 0 : indent)).join('\n').trim();
      const titleMatch = dedented.match(/^#\s+(.+)$/m);
      const dateMatch  = dedented.match(/^<!--\s*date:\s*(.+?)\s*-->$/m);
      if (titleMatch) { document.getElementById('article-title').textContent = titleMatch[1]; document.title = titleMatch[1] + ' — jakalope.ai'; }
      if (dateMatch)  { document.getElementById('article-date').textContent = dateMatch[1]; }
      let content = dedented;
      if (titleMatch) content = content.replace(/^#[ \t]+.+\n?/m, '');
      if (dateMatch)  content = content.replace(/^<!--\s*date:\s*.+?[ \t]*-->\n?/m, '');
      bodyEl.innerHTML = marked.parse(content.trimStart(), { breaks: false, gfm: true });
    })();
  </script>
  <script>
    (function () {
      var t = document.getElementById('nav-toggle');
      var l = document.getElementById('nav-links');
      if (!t || !l) return;
      t.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = l.classList.toggle('open');
        t.setAttribute('aria-expanded', open ? 'true' : 'false');
        t.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      });
      document.addEventListener('click', function () {
        l.classList.remove('open');
        t.setAttribute('aria-expanded', 'false');
        t.setAttribute('aria-label', 'Open menu');
      });
    })();
  </script>
</body>
</html>
