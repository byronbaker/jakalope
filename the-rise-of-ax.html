# The Rise of AX: From Vibe Design to Agentic Experience Design

*A friendly look at the design discipline that's quietly being invented right now — and why I'm excited about it*

---

If design has felt a little wild lately, you're not imagining it. The ground is moving. And honestly? It's one of the most exciting moments to be in this work that I can remember.

Let me tell you what's happening, why it matters, and how to think about your role in it. No jargon, no hand-wringing — just the shape of the thing as I see it.

## The story so far

A year and change ago, Andrej Karpathy gave a name to something a lot of people were already doing. He called it **vibe coding** — describing what you want in plain language, accepting whatever the AI ships, and trusting the result enough to keep going. He [coined the term in February 2025](https://en.wikipedia.org/wiki/Vibe_coding), Collins made it the Word of the Year, and within months designers had run with the idea — vibe design, vibe prototyping, vibe everything.

It was joyful. It opened up making to a lot of people who'd been gatekept out of it. I love what it did for the field.

And — this is the important part — it was a stop on the way, not the destination.

What's emerging now is bigger, more interesting, and more demanding of you as a designer. It's called **AX** — Agentic Experience Design — and I think it's going to define the next decade of our work.

## What AX actually is

Here's the simplest way I can put it: **AX is the design of the workflow that humans and AI agents share.**

The term started showing up in early 2025, when Netlify's CEO Mathias Biilmann started using it to describe the experience an AI agent has when it interacts with your product — sitting next to UX (the experience your human user has) and DX (the experience a developer has). The framing has since been picked up by a lot of thoughtful people: [Notch](https://wearenotch.com/blog/what-is-agentic-experience/), [Pixelmojo](https://www.pixelmojo.io/blogs/what-is-ax-design-complete-guide-agentic-experience-2026), and [10Clouds](https://10clouds.com/blog/a-i/agentic-experience-ax-the-ux-of-agentic-ai-era/) all have great primers.

The early conversation about AX treated agents as just another audience. "Design for the bot, too." That's true and a little limited. The richer way to think about it — and where the interesting design work lives — is the **shared workflow**: a human and one or more agents are jointly responsible for an outcome, and your job as a designer is the *seam* between them.

## Why this is genuinely a new craft

This is the part I want you to feel in your bones, because it changes what design *is*.

Traditional UX is **predictable.** Your user clicks a button. The system does the thing. You can know in advance what will happen, and your job is to make sure that "thing" matches what your user expected. Beautiful, deterministic, designable.

AX is **probabilistic.** An agent might take an action you didn't plan, using a path you didn't lay out, producing an outcome that's correct-but-surprising — or expected-but-wrong. The challenge isn't *make the response match the click* anymore. It's *make the agent's behavior easy to read, easy to override, and worthy of trust across a whole range of possible behaviors.*

That's a real shift. And it's why "vibe design" was a stop on the way. Vibe design is about the moment of generation — say a thing, get a thing, ship a thing. It treats the model as a fast pencil. AX treats the model as a *partner in the work* whose behavior over time, across edge cases, and alongside a human collaborator is what you're really designing. The pencil isn't the product. The collaboration is the product.

## Four principles to ground yourself in

There's no canonical AX style guide yet (some are being written; none are great). But across every serious treatment of this I've read, four ideas keep showing up. Use these as your starting compass.

**Design for two audiences at once.** Your interface needs to work for a human *and* be operable by an agent. Humans need things to be readable and controllable; agents need things to be structured and predictable. [Standard Beagle has the most practical writeup I've seen on what this looks like in real product work](https://standardbeagle.com/agent-based-experience-design/).

**Earn trust, don't assume it.** Agents are probabilistic, which means your users will (correctly) discount what they say. Your design has to *show its work* — show the reasoning, show the confidence, show the source, make it easy to disagree. The polish that used to come from beautiful UI now comes from honest scaffolding around uncertainty.

**Override is a first-class feature, not a safety net.** Every action an agent takes needs a visible, low-friction way to undo or change it. Not buried in a settings menu. Right there, one click away. Override is to AX what undo is to a text editor — not optional, *the primary affordance the whole experience is built around.*

**Watch the agent the way you'd watch a new hire.** UX measures whether the human accomplished the task. AX has to also measure whether the *agent* did, whether it did so correctly, and whether the human caught the cases where it didn't. [Mobisoft's 2025 overview](https://mobisoftinfotech.com/resources/blog/ui-ux-design/ai-ux-2025-rise-of-ax) calls out continuous monitoring as a core practice — and it really is. You're coaching a new colleague who never sleeps. Treat it that way.

## A small taste of the work

Here's a fragment from a recent AX spec — generic, but it shows the shape:

> **Workflow seam:** Agent drafts a categorization for an incoming item. Human confirms or recategorizes.
>
> **Default state:** Agent's draft is pre-filled. Confidence shown right there in the interface (high / medium / low / unsure). Source citation reachable in one click.
>
> **Override:** One click to recategorize. No confirmation popup. The override is logged and used as a training signal.
>
> **When the agent is unsure:** No pre-fill, no draft — just the source material and the categorization options. The agent never biases the human in cases it doesn't understand.

Notice what's *not* there: no hero animation, no clever micro-interaction, no hover delight. AX work today is mostly about *what gets shown when, who has the next move, and how the human stays in real control of a probabilistic partner.* The visual layer comes after — and it'll be beautiful, but it's downstream of the harder work.

## You belong here

If you're a designer or researcher reading this and wondering "am I behind?" — you are not. We are *all* early. The discipline is being invented right now, and the people inventing it are the ones who decide to take it seriously and start practicing.

Here's what I'd do this month if I were you. Pick one product you use that has an AI feature. Look for the seam — the place the agent and the human pass work to each other. Ask yourself: is the agent's confidence visible? Is override one click away? Does the experience earn my trust or assume it? Sketch what you'd change.

That's it. That's the practice. Do it ten times and you'll have better AX intuition than most teams shipping products today. Vibe design opened the door. AX is the room you walk into. It's a great room. Come on in.
