# The Rise of AX: From Vibe Design to Agentic Experience Design

*A friendly map of the moment we're designing inside, the discipline being invented to meet it, and where you fit*

---

If product design has felt a little wild lately, you're not imagining it. The ground is moving. And honestly? It's one of the most exciting moments to be in this work that I can remember.

Let me give you a map. Where we are in the larger arc of digital design, why what's emerging is genuinely a new craft (and not just "UX with AI in it"), and what it means for your role in it. No jargon. No hand-wringing. Just the shape of the thing as I see it.

## The four eras of digital design

To understand why this moment is a real shift and not another wave of buzzwords, it helps to look at where it sits in the larger arc. Each era of digital design has been roughly a twenty-year run, ended by a hardware moment, and defined by a single new question that designers were trying to answer for the first time.

| Era | Years | The question we were learning to answer | Trust came from |
|---|---|---|---|
| **GUI** | 1974–1994 | *How do I make the computer feel like something people already know?* | Skeuomorphism — make the digital thing look like the physical thing |
| **Web UX** | 1994–2007 | *How do I help someone find what they're looking for?* | Usability — clear hierarchy, predictable navigation |
| **Product UX** | 2007–2023 | *How do I help someone accomplish a goal, end-to-end?* | Consistency — predictable patterns across every touchpoint |
| **AX** | 2024–present | *How do I help someone know whether the agent did well?* | **Explainability — visible reasoning, calibrated confidence, easy override** |

A few things worth noticing about this picture.

**Each era inherits the prior one without replacing it.** A modern product still has a GUI. It still lives on the web. It still respects an end-to-end journey. AX is added on top — the agent layer is a new mode of interaction sitting alongside the click and the tap and the form fill. AX *contains* UX. It doesn't replace it.

**Each transition was disorienting at the time and obvious in hindsight.** When the iPhone arrived, the people doing great work on web pages weren't automatically doing great work on mobile apps. The principles transferred; the *craft* did not. Mobile-first thinking had to be invented as a practice. The same is true now.

**Each era's trust mechanism was a response to the prior era's anxiety.** People didn't trust the GUI until skeuomorphism made it feel familiar. People didn't trust the web until usable navigation made it feel knowable. People didn't trust mobile apps until consistent patterns made them feel reliable. People will not trust agents until *explainability* makes them feel accountable. **AX trust is accountability trust** — the trust you have in a competent colleague who shows their work.

There's something almost philosophical here. Each era of digital design has been a long argument about how machines and humans should share understanding. AX is the latest move in that conversation, and the argument it makes is the most demanding one yet: *we will show our reasoning, name our confidence, accept your correction, and get better.* That's not a design pattern. That's a relationship. The discipline of AX is the discipline of designing that relationship.

## Vibe design is not AX design

Before we go further, a distinction that matters more than it sounds.

A year ago, Andrej Karpathy gave a name to something a lot of people were already doing. He called it **vibe coding** — describing what you want in plain language, accepting whatever the AI ships, and trusting the result enough to keep going. He [coined the term in February 2025](https://en.wikipedia.org/wiki/Vibe_coding), Collins made it Word of the Year, and within months designers had run with it: vibe design, vibe prototyping, vibe everything. AI tools dropped the floor of creation so far that *intent alone* could produce a functional artifact. Genuinely new. Genuinely useful for some kinds of work.

And here's the part that's easy to miss: **when the floor drops, the ceiling becomes the only defensible value.**

The clearest analogy I have for this is *home cooking versus a Michelin kitchen.* AI lowered the cost of home cooking to near zero — anyone with a few ingredients and a YouTube tutorial can put a passable meal on the table. That doesn't threaten a great restaurant. It actually clarifies what a great restaurant is *for*: trained judgment, a held standard, a result that survives at scale, and the kind of trust only an expert practice can earn.

Vibe design is the home cooking. AX design is the Michelin kitchen. Both are valid. They serve different purposes. AX work begins with a validated business problem, applies a structured methodology, and is accountable to outcomes beyond the practitioner's personal satisfaction. Vibe design begins with an idea and ends when it works for the person who made it. The methodology is the moat. Not the tools.

## Why this is genuinely a new craft

Here's the shift in one sentence:

> **Traditional UX is predictable. AX is probabilistic.**

In a traditional UX, the user clicks a button, the system does the thing, you can know in advance what will happen. Your design job is to make the response match what the user expected.

In AX, the user expresses an intent in natural language ("book me a flight to Chicago next Thursday, aisle seat, under $400"). The agent decides what to do, in what order, with what trade-offs, sometimes calling tools the user didn't specify, sometimes interpreting words the user used loosely. Your design job is now several jobs at once: you design the **intent capture**, the **agent loop**, the **moments of human oversight**, the **scaffolding that makes the agent's behavior legible**, and the **override paths** for everything the agent might get wrong.

This is the line that, when teams cross it, their AX work starts to get good: *in UX you design the response; in AX you design the behavior.* The agent is a partner in the work. Its behavior over time, across edge cases, in moments of high confidence and moments of uncertainty — that's what you're designing. This is closer to designing *a person* than designing *a screen*. AX work borrows more from management than it does from graphic design. Sit with that.

## Four principles to ground yourself in

There's no canonical AX style guide yet. But across every serious treatment of this discipline I've read, four principles keep showing up. Use them as your starting compass.

**Design for two audiences at once.** Your interface needs to work for a human *and* be operable by an agent. Humans want readable surfaces and visible state; agents want structured surfaces and predictable affordances. Good news: most of what makes a surface agent-operable also makes it more accessible to humans. There's convergence here, not conflict. [Standard Beagle has the most practical writeup I've seen](https://standardbeagle.com/agent-based-experience-design/) on what this looks like in real product work.

**Earn trust, don't assume it.** Show confidence visibly (high / medium / low / unsure). Show the source — every claim traceable, one click away. Show the load-bearing reasoning ("I chose this because of X, ruled out Y because of Z"). The polish that used to come from beautiful UI now comes from honest scaffolding around uncertainty.

**Override is a first-class feature, not a safety net.** Every action an agent takes needs a visible, low-friction way to undo, change, or take over. Not buried in a settings menu. Right there. One click away. *Override is to AX what undo is to a text editor.* If your override is more than one click away from the action, your experience doesn't pass the AX bar.

**Watch the agent the way you'd watch a new hire.** Track override rate per seam (where are humans correcting the agent most?), escalation rate (is it appropriately handing off, or being overconfident?), and confidence calibration drift (is its sense of certainty staying honest over time?). [Mobisoft's 2025 overview](https://mobisoftinfotech.com/resources/blog/ui-ux-design/ai-ux-2025-rise-of-ax) calls this out, and it really matters. Most teams new to AX skip this layer and then wonder why their agent feels worse three months in than at launch. Build the instrumentation on day one.

## The unit of design is the seam

Here's the single most useful reframe for an AX designer: the unit of design is not the screen. It's not even the flow. It's the **seam** — the moment where work passes between the human and the agent.

At each seam you have a small number of decisions: what gets shown, who has the next move, how fast the override is, what the absence of action means, what gets logged. A team that designs the seams well — even with mediocre interface design elsewhere — ships AX that earns trust. A team that designs beautiful interfaces but treats the seams as an afterthought ships AX that frustrates and gets discarded.

## Why this is happening now (a short market note)

Three numbers worth knowing if you're trying to make the case to your team or your org.

- **+60% / –43%.** Agencies that have embedded AI into their day-to-day workflows are seeing margin expansion of up to 60% versus pre-AI baselines. Meanwhile, the broader market value of standalone design services has dropped roughly 43% year over year. The unit economics of delivery have permanently changed.
- **73% / 34%.** About 73% of enterprises are using or piloting AI in core business functions. Only 34% are *truly reimagining* their business around it. The other 66% are bolting AI onto existing workflows and stalling out. The opportunity isn't in the tooling — it's in the workflow redesign and change management around the tooling.
- **12–18 months.** Industry analyst consensus puts the window for establishing what AI-native delivery looks like at roughly twelve to eighteen months. After that, the leaders in each category will largely be set. The firms moving deliberately *now* will define the bar for everyone else.

Two phrases worth memorizing inside this market: *the Enterprise Paradox* (clients want faster AI-driven delivery while being structurally unable to absorb the workflow changes that make it possible) and *bounded autonomy* (managed agents with explicit oversight and human-in-the-loop checkpoints — what enterprises are actually buying when they buy "agents," because nobody is buying full automation).

## A taste

A small AX spec, generic but illustrative:

> **Workflow seam:** Agent drafts a categorization for an incoming document. Human confirms or recategorizes.
>
> **Default state:** Agent's draft is pre-filled. Confidence shown right there in the interface (high / medium / low / unsure). Source citation reachable in one click.
>
> **Override:** One click to recategorize. No confirmation popup. The override is logged and used as a training signal.
>
> **When the agent is unsure:** No pre-fill, no draft — just the source material and the categorization options. The agent never biases the human in cases it doesn't understand.
>
> **Drift watch:** Override rate above 25% over a rolling 7-day window triggers a review. Confidence calibration check runs monthly.

Notice what's *not* there. No hero animation. No clever micro-interaction. AX work today is mostly about *what gets shown when, who has the next move, and how the human stays in real control of a probabilistic partner.* The visual layer comes after — and it'll be beautiful, but it's downstream of the harder work.

## You belong here

If you're a designer or researcher reading this and wondering "am I behind?" — you are not. We are *all* early. The discipline is being invented in real time, and the people inventing it are the ones who decide to take it seriously and start practicing.

Here's what I'd do this month if I were you. Pick one product you use that has an AI feature. Look for the seam. Ask yourself: is the agent's confidence visible? Is override one click away? Does the experience earn my trust or assume it? Is anything being measured? Sketch what you'd change.

Do it ten times and you'll have better AX intuition than most teams shipping products today. Vibe design opened the door. AX is the room you walk into. It's a great room. Come on in. There's plenty to do.

  <script>
    (function () {
      const mdEl = document.getElementById('md-content');
      const bodyEl = document.getElementById('article-body');
      if (!mdEl || !bodyEl || typeof marked === 'undefined') return;
      const raw = mdEl.textContent;
      const lines = raw.split('\n');
      const nonEmpty = lines.filter(l => l.trim().length > 0);
      const indent = nonEmpty.reduce((min, l) => { const m = l.match(/^(\s*)/); return Math.min(min, m ? m[1].length : 0); }, Infinity);
      const dedented = lines.map(l => l.slice(indent === Infinity ? 0 : indent)).join('\n').trim();
      const titleMatch = dedented.match(/^#\s+(.+)$/m);
      const dateMatch  = dedented.match(/^<!--\s*date:\s*(.+?)\s*-->$/m);
      if (titleMatch) { document.getElementById('article-title').textContent = titleMatch[1]; document.title = titleMatch[1] + ' — jakalope.ai'; }
      if (dateMatch)  { document.getElementById('article-date').textContent = dateMatch[1]; }
      let content = dedented;
      if (titleMatch) content = content.replace(/^#[ \t]+.+\n?/m, '');
      if (dateMatch)  content = content.replace(/^<!--\s*date:\s*.+?[ \t]*-->\n?/m, '');
      bodyEl.innerHTML = marked.parse(content.trimStart(), { breaks: false, gfm: true });
    })();
  </script>
