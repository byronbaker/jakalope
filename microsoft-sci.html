# Microsoft — Security, Compliance & Identity

**Aligning a billion-dollar security platform around a single, unified vision**

Microsoft's Security, Compliance & Identity division was building some of the most powerful security software in the world — but across fragmented teams, fragmented products, and fragmented roadmaps. The challenge wasn't capability. It was coherence. Over 18 months, we partnered with Microsoft to envision what SCI could become, align the organization around that vision, and present it to the executive leadership team as proof that the teams were focused on the right things.

### Approach

I led the initial response that won this engagement and took the executive sponsor role throughout — managing the client relationship, maintaining vision continuity across three distinct but connected projects, and ensuring each deliverable laddered up to a single coherent story.

The work spanned three programs:

**Enterprise Security Vision** — envisioning the future of Microsoft Defender and Microsoft Sentinel as a unified experience rather than two parallel products. The brief was explicit: no sci-fi, no blue-sky speculation. UI two to three years out, grounded in what was technically possible but not yet built. The output was a fully manifested vision presented at the SCI team's half-year product update.

**Microsoft SCI Platform Video** — an immersive, narrated video showing how SCI's security platform integrates with everyday Microsoft tools, using a real-world security breach scenario as its backbone. The film demonstrated, concretely, how Defender, Sentinel, and Teams work together when it matters most — a threat in motion, neutralized in real time.

**Family Safety Vision** — envisioning how enterprise-grade security thinking translates to consumer family safety. This was the most research-intensive of the three: stakeholder interviews across product teams, scenario prioritization workshops, and a design envisioning sprint. The core insight driving the work: successful consumer security products are never sold as security. Apple sells privacy. Mesh wifi networks sell garden coverage. The product needed to meet people where they were — convenience first, security underneath.

The Family Safety work crystallized around: *"a secure ecosystem of your life."* Centralized, simple, proactive, and built for the moments that actually matter to families — kids' first devices, elderly parents developing better habits, working from a public network without thinking about it.

### The hard part

Microsoft's SCI division had no shortage of talented designers and product thinkers. The challenge was that each team had its own vocabulary, its own roadmap, and its own definition of what the platform was for. Our role wasn't just to design — it was to synthesize across organizational boundaries and produce artifacts that a diverse group of stakeholders could point to and say: *this is where we're going.*

Getting there required running envisioning workshops that forced alignment in real time, not just documentation after the fact. It also required resisting pressure to make the work aspirational at the expense of credibility. The vision had to be achievable — because it was going to the CEO.

### Outcome

Three interconnected vision artifacts — an enterprise UX vision, a platform demonstration film, and a consumer product vision — presented to Microsoft's CEO as evidence of strategic alignment across the SCI organization. The work gave leadership confidence that the teams were building toward the same future, established a shared vocabulary across product groups, and set the design direction for the roadmap through 2025.

Reference available on request.

      const nonEmpty = lines.filter(l => l.trim().length > 0);
      const indent = nonEmpty.reduce((min, l) => {
        const m = l.match(/^(\s*)/);
        return Math.min(min, m ? m[1].length : 0);

      const dedented = lines.map(l => l.slice(indent === Infinity ? 0 : indent)).join('\n').trim();

        var open = l.classList.toggle('open');
        t.setAttribute('aria-expanded', open ? 'true' : 'false');
        t.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      });
      document.addEventListener('click', function () {
        l.classList.remove('open');
        t.setAttribute('aria-expanded', 'false');
        t.setAttribute('aria-label', 'Open menu');
      });
    })();
  </script>
</body>
</html>
