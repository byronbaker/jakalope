# Microsoft — AI Skills Navigator

**Reimagining enterprise learning for a world where AI changes what it means to know something**

Microsoft already had two of the most widely used learning platforms in the world — Microsoft Learn and LinkedIn Learning. What they didn't have was a platform built for the moment we're actually in: one where the skills workers need are changing faster than any catalog can track, where the gap between completing a course and applying knowledge is where most learning dies, and where AI itself is both the subject everyone urgently needs to understand and the tool that should be reshaping how understanding happens.

The brief was to envision an AI-native learning platform — one that went beyond certification tracks and course catalogs to offer something genuinely different: bespoke, adaptive, skills-focused pathways that met learners where they were and moved with them.

### Approach

We opened with research across both sides of the learning relationship: learners and the decision-makers who curate, mandate, and measure learning for their organizations. Nineteen 90-minute interviews — business professionals, IT professionals, team leads, L&D leaders, and C-suite stakeholders — gave us a clear picture of why enterprise learning consistently underdelivers despite significant investment.

The core finding was sharp enough to drive the entire design direction: **consumption is not engagement, and engagement is not transformation.** People complete courses. They do not necessarily learn from them. The platforms that existed — including Microsoft's own — optimized for completion metrics while the actual goal, behavior change and skill application, remained largely unaddressed. Compounding this: choosing the right course in the first place was overwhelming, the connection between learning and real work was almost never achieved, and there was an acute, urgent need to learn about AI that was running directly into anxiety about what AI was doing to the nature of work itself.

The solution wasn't more content or a better recommendation engine. It required rethinking the underlying model — from a library users navigate to an agent that navigates with them.

We developed thinking style archetypes from the research to capture the range of learner motivations, AI sentiments, and decision-making patterns. These guided the concept design phase, where we explored the visual language and interaction model through moodboards and concept cards before moving into strategic narratives — full north star stories that made the agentic vision concrete enough to put in front of users for feedback.

The resulting experience framework centered on an agentic front door: an AI that could assess where a learner was, understand what their role and goals required, and build a personalized learning plan that adapted as they progressed. Signature experiences included dynamic personalized homepages, adaptable learning formats, and skill tracking that connected learning directly to job-relevant capability — not just completed coursework.

![Microsoft AI Skills Navigator learning framework and agentic experience concept design](images/msaiskills-secondary.png)

### Outcome

The platform launched as Microsoft AI Skills Navigator. The work gave Microsoft a product direction grounded in how people actually learn — and fail to learn — at work, a design language for an AI-native experience distinct from anything in their existing portfolio, and a strategic framework for making learning something that compounds rather than accumulates.

  <script>
    (function () {
      var t = document.getElementById('nav-toggle');
      var l = document.getElementById('nav-links');
      if (!t || !l) return;
      t.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = l.classList.toggle('open');
        t.setAttribute('aria-expanded', open ? 'true' : 'false');
        t.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      });
      document.addEventListener('click', function () {
        l.classList.remove('open');
        t.setAttribute('aria-expanded', 'false');
        t.setAttribute('aria-label', 'Open menu');
      });
    })();
  </script>
</body>
</html>
